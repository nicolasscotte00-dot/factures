<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Factures">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<title>Factures</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#dde2ea;--accent:#1f5fbf;--brand:#1f3a5f;--danger:#c0392b}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;background:#e6ebf3;color:var(--ink)}
button.primary{background:var(--accent);color:#fff}
button:disabled{opacity:.6}
.haut{position:sticky;top:0;z-index:5;background:var(--bg)}
header{display:flex;align-items:center;gap:6px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--brand);color:#fff}
header h1{font-size:18px;margin:0 auto 0 0}
header button{background:rgba(255,255,255,.16);color:#fff;padding:8px 11px}
.tabs{display:flex;gap:4px;margin:12px 16px 4px;background:#e3e8ef;border-radius:10px;padding:4px}
.tabs button{flex:1;background:none;padding:8px}
.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{display:grid;gap:16px;padding:16px;max-width:1600px;margin:0 auto}
body[data-tab=saisie] .preview,body[data-tab=apercu] .editor{display:none}
@media (min-width:1000px){
  .tabs{display:none}
  main{grid-template-columns:minmax(380px,1fr) minmax(0,1.15fr);align-items:start}
  body[data-tab] .editor,body[data-tab] .preview{display:block}
}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical}
.hint{width:100%;margin-bottom:16px;background:#fff6d9;text-align:left}
.ligne{display:grid;grid-template-columns:70px 64px 1fr 96px;grid-template-areas:"d d d x" "q u p t";gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ligne:first-child{padding-top:0}
.ligne .d{grid-area:d}.ligne .q{grid-area:q}.ligne .u{grid-area:u}.ligne .p{grid-area:p}
.ligne .x{grid-area:x;justify-self:end;align-self:end;color:var(--danger);background:#fbeceb}
.ligne .t{grid-area:t;align-self:end;text-align:right;font-weight:600;padding-bottom:10px}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.preview{min-width:0}
.scaler{width:794px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.bar .total{margin-right:auto;font-size:12px;color:var(--muted);line-height:1.2}
.bar .total b{display:block;font-size:20px;color:var(--ink)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:17px}
.dlg-b{padding:16px}
.dlg-b .note{font-size:13px;color:var(--muted)}
.hi{display:flex;gap:6px;margin-bottom:8px}
.hi button:first-child{flex:1;text-align:left;background:#f1f4f8}
.hi.on button:first-child{outline:2px solid var(--accent)}
.hi small{display:block;color:var(--muted)}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
.tl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .n3{grid-column:2;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.tl output{font-weight:600;padding-bottom:10px;white-space:nowrap}
.tl.off{opacity:.45}
details pre{white-space:pre-wrap;font-size:12px;background:#f5f7fa;padding:8px;border-radius:8px;max-height:220px;overflow:auto}
/* ---------- La facture (A4 = 794 px de large) ---------- */
.inv{width:794px;min-height:1120px;display:flex;flex-direction:column;padding:56px 60px;background:#fff;color:#222;font:13px/1.45 "Helvetica Neue",Arial,sans-serif;letter-spacing:.01px/* sinon le PDF colle les mots (html2canvas) */;box-shadow:0 2px 14px rgba(0,0,0,.12);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv .top{display:flex;justify-content:space-between;gap:24px}
.inv .em b{font-size:18px;color:#1f3a5f}
.inv h3{margin:0 0 6px;font-size:30px;letter-spacing:.08em;color:#1f3a5f;text-align:right}
.inv .meta{text-align:right;white-space:nowrap}
.inv .cl{width:320px;margin:36px 0 28px auto;padding:14px 16px;border:1px solid #dde2ea;border-radius:6px}
.inv .cl small{display:block;color:#888;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.inv .cl b{font-size:15px}
.inv table{width:100%;border-collapse:collapse}
.inv th{background:#1f3a5f;color:#fff;text-align:left;padding:8px;font-weight:600}
.inv td{padding:8px;border-bottom:1px solid #e5e8ee;vertical-align:top}
.inv .n{text-align:right;white-space:nowrap}
.inv .vide{color:#aaa;text-align:center}
.inv .tot{width:320px;margin:16px 0 0 auto}
.inv .tot div{display:flex;justify-content:space-between;padding:4px 8px}
.inv .tot .big{margin-top:4px;padding:9px 8px;background:#eef3fa;border-radius:4px;font-weight:700;font-size:16px}
.inv .mention{margin:18px 0 0;font-style:italic;color:#555}
.inv .pay{margin-top:24px}
.inv .notes{margin-top:16px}
.inv .foot{margin-top:auto;padding-top:20px;border-top:1px solid #dde2ea;font-size:11px;color:#777;text-align:center}
.pre{white-space:pre-line}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  header,.tabs,.editor,.bar,dialog{display:none!important}
  main{display:block;padding:0}
  .preview{display:block!important}
  .scaler{zoom:1!important}
  .inv{box-shadow:none}
}
</style>
</head>
<body data-tab="saisie">

<div class="haut">
  <header>
    <h1>Factures</h1>
    <button id="bNouvelle">＋ Nouvelle</button>
    <button id="bHist">Historique</button>
    <button id="bReglages" aria-label="Réglages">⚙︎</button>
  </header>
  <nav class="tabs">
    <button data-tab="saisie" class="on">Saisie</button>
    <button data-tab="apercu">Aperçu</button>
  </nav>
</div>

<main>
  <section class="editor">
    <button class="hint" id="hint" hidden>👋 Commence par tes coordonnées : <u>ouvrir les réglages</u></button>

    <div class="card">
      <h2>Facture</h2>
      <div class="grid">
        <label>N° de facture<input name="f.numero" autocomplete="off"></label>
        <label>TVA
          <select name="f.tva">
            <option value="21">TVA 21 %</option>
            <option value="12">TVA 12 %</option>
            <option value="6">TVA 6 %</option>
            <option value="auto">Autoliquidation</option>
            <option value="franchise">Franchise (pas de TVA)</option>
          </select>
        </label>
        <label>Date<input type="date" name="f.date"></label>
        <label>Échéance<input type="date" name="f.echeance"></label>
      </div>
    </div>

    <div class="card">
      <h2>Client</h2>
      <div class="grid">
        <label class="full">Nom<input name="c.nom" list="clients" autocomplete="off"></label>
        <label class="full">Adresse<textarea name="c.adresse" rows="2"></textarea></label>
        <label>E-mail<input type="email" name="c.email"></label>
        <label>N° TVA (si pro)<input name="c.tva"></label>
      </div>
      <datalist id="clients"></datalist>
    </div>

    <div class="card">
      <h2>Lignes</h2>
      <div id="lignes"></div>
      <div class="add">
        <button data-add="article">＋ Article</button>
        <button data-add="km">＋ Déplacement</button>
        <button data-add="heure">＋ Main-d'œuvre</button>
        <button id="bTicket">📷 Ticket</button>
        <input type="file" id="fTicket" accept="image/*" hidden>
      </div>
    </div>

    <div class="card">
      <h2>Notes</h2>
      <textarea name="f.notes" rows="3" placeholder="Conditions, remarques…"></textarea>
    </div>
  </section>

  <section class="preview"><div class="scaler"><div class="inv" id="facture"></div></div></section>
</main>

<footer class="bar">
  <div class="total"><span id="sous"></span><b id="total"></b></div>
  <button id="bPrint">🖨 Imprimer</button>
  <button id="bPdf" class="primary">📤 PDF</button>
</footer>

<dialog id="dlgHist">
  <div class="dlg-h"><h2>Historique</h2><button autofocus onclick="this.closest('dialog').close()">Fermer</button></div>
  <div class="dlg-b" id="hist"></div>
</dialog>

<dialog id="dlgTicket">
  <div class="dlg-h"><h2>Ticket fournisseur</h2><button autofocus onclick="this.closest('dialog').close()">Fermer</button></div>
  <div class="dlg-b" id="ticket"></div>
</dialog>

<dialog id="dlgReglages">
  <div class="dlg-h"><h2>Réglages</h2><button autofocus onclick="this.closest('dialog').close()">Fermer</button></div>
  <div class="dlg-b">
    <div class="grid">
      <label class="full">Nom / société<input name="r.nom"></label>
      <label class="full">Adresse<textarea name="r.adresse" rows="2"></textarea></label>
      <label>Téléphone<input type="tel" name="r.tel"></label>
      <label>E-mail<input type="email" name="r.email"></label>
      <label class="full">N° d'entreprise / TVA<input name="r.entreprise" placeholder="BE 0123.456.789"></label>
      <label>IBAN<input name="r.iban" placeholder="BE00 0000 0000 0000"></label>
      <label>BIC<input name="r.bic"></label>
      <label>Tarif déplacement (€/km)<input name="r.km" inputmode="decimal"></label>
      <label>Taux horaire (€/h)<input name="r.heure" inputmode="decimal"></label>
      <label>Délai de paiement (jours)<input name="r.delai" inputmode="numeric"></label>
      <label class="full">Notes par défaut (nouvelles factures)<textarea name="r.notes" rows="2"></textarea></label>
    </div>
    <h3>Sauvegarde</h3>
    <p class="note">Les factures sont enregistrées sur cet appareil uniquement. Sur iPhone, ajoute l'app à l'écran d'accueil et fais une sauvegarde de temps en temps.</p>
    <div class="add">
      <button id="bExport">⬇ Exporter</button>
      <button onclick="document.getElementById('fImport').click()">⬆ Importer</button>
      <input type="file" id="fImport" accept="application/json,.json" hidden>
    </div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const KEY = 'factures-v1';
const DEFAUT = {nom:'', adresse:'', tel:'', email:'', entreprise:'', iban:'', bic:'', km:'0,45', heure:'45', delai:'30', notes:'', marge:'20', ticketTvac:false};
const MENTIONS = {
  franchise: 'Régime particulier de franchise des petites entreprises – TVA non applicable.',
  auto: 'Autoliquidation – TVA due par le cocontractant (art. 20, A.R. n° 1).'
};
const eur = new Intl.NumberFormat('fr-BE', {style: 'currency', currency: 'EUR'});
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = c => eur.format(c / 100);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const plusJours = (iso, n) => { if (!iso) return ''; const d = new Date(iso + 'T12:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dt = s => s ? new Date(s + 'T12:00').toLocaleDateString('fr-BE') : '';
const tactile = matchMedia('(pointer: coarse)').matches;

// Montants en centimes pour éviter les erreurs d'arrondi.
function calc(f) {
  const lignes = f.lignes.map(l => Math.round(num(l.qte) * num(l.pu) * 100));
  const ht = lignes.reduce((a, b) => a + b, 0);
  const taux = MENTIONS[f.tva] ? 0 : num(f.tva);
  const tva = Math.round(ht * taux / 100);
  return {lignes, ht, taux, tva, ttc: ht + tva};
}
// Auto-contrôle du calcul (message dans la console s'il est faux)
(() => { const r = calc({tva: '21', lignes: [{qte: '3', pu: '19,99'}, {qte: '12', pu: '0.45'}]});
  console.assert(r.ht === 6537 && r.tva === 1373 && r.ttc === 7910, 'Calcul de facture faux', r); })();

// ---------- Données (localStorage) ----------
let db, alerteSauvegarde = false;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!db?.factures) db = {reglages: {}, factures: [], courante: null};

function sauver() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { if (!alerteSauvegarde) { alerteSauvegarde = true; alert('Attention : sauvegarde impossible sur cet appareil (' + e.message + ').'); } }
}
const cur = () => db.factures.find(f => f.id === db.courante);
const estVide = f => !f.client.nom && f.lignes.every(l => !l.desc && !num(l.pu));

function prochainNumero() {
  const y = new Date().getFullYear(), re = new RegExp('^' + y + '-(\\d+)$');
  const n = Math.max(0, ...db.factures.map(f => +(f.numero.match(re)?.[1] || 0))) + 1;
  return y + '-' + String(n).padStart(3, '0');
}

function creer(base) {
  const date = today();
  const f = {
    id: Date.now().toString(36), numero: prochainNumero(), date,
    echeance: plusJours(date, num(db.reglages.delai)),
    tva: base?.tva ?? db.factures.at(-1)?.tva ?? '21',
    client: base ? {...base.client} : {nom: '', adresse: '', email: '', tva: ''},
    lignes: base ? base.lignes.map(l => ({...l})) : [{desc: '', qte: '1', unite: '', pu: ''}],
    notes: base ? base.notes : db.reglages.notes
  };
  db.factures.push(f);
  ouvrir(f.id);
}

function ouvrir(id) {
  db.courante = id;
  sauver(); remplir(); renderLignes(); rendu();
}

// ---------- Formulaire ----------
function remplir() {
  const f = cur();
  document.querySelectorAll('[name]').forEach(el => {
    const [s, k] = el.name.split('.');
    const v = s === 'f' ? f[k] : s === 'c' ? f.client[k] : s === 'r' ? db.reglages[k] : undefined;
    if (v !== undefined) el.value = v;
  });
  const noms = [...new Set(db.factures.map(x => x.client.nom.trim()).filter(Boolean))];
  $('#clients').innerHTML = noms.map(n => `<option value="${esc(n)}">`).join('');
  $('#hint').hidden = !!db.reglages.nom;
}

function renderLignes() {
  const f = cur(), t = calc(f);
  $('#lignes').innerHTML = f.lignes.map((l, i) => `
    <div class="ligne">
      <label class="d">Désignation<input name="l.desc.${i}" value="${esc(l.desc)}"></label>
      <button class="x" data-del="${i}" aria-label="Supprimer la ligne">✕</button>
      <label class="q">Qté<input name="l.qte.${i}" inputmode="decimal" value="${esc(l.qte)}"></label>
      <label class="u">Unité<input name="l.unite.${i}" value="${esc(l.unite)}"></label>
      <label class="p">Prix unit. €<input name="l.pu.${i}" inputmode="decimal" value="${esc(l.pu)}"></label>
      <output class="t" id="t${i}">${fmt(t.lignes[i])}</output>
    </div>`).join('');
}

function clientConnu(nom) {
  nom = nom.trim().toLowerCase();
  return nom && [...db.factures].reverse().find(f => f.id !== db.courante && f.client.nom.trim().toLowerCase() === nom)?.client;
}

function saisie(e) {
  const el = e.target, [s, k, i] = (el.name || '').split('.'), f = cur();
  if (s === 'f') {
    f[k] = el.value;
    if (k === 'date') $('[name="f.echeance"]').value = f.echeance = plusJours(el.value, num(db.reglages.delai));
  } else if (s === 'c') {
    f.client[k] = el.value;
    const connu = k === 'nom' && clientConnu(el.value);
    if (connu) { for (const x of ['adresse', 'email', 'tva']) f.client[x] ||= connu[x]; remplir(); }
  } else if (s === 'l') {
    f.lignes[i][k] = el.value;
    $('#t' + i).textContent = fmt(calc(f).lignes[i]);
  } else if (s === 'r') {
    db.reglages[k] = el.value;
    $('#hint').hidden = !!db.reglages.nom;
  } else return;
  modifie();
}
document.addEventListener('input', saisie);
document.addEventListener('change', saisie);

function modifie() { pdfPret = null; majPdf(); sauver(); rendu(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const f = cur();
  if (b.dataset.add) {
    const r = db.reglages;
    f.lignes.push({
      article: {desc: '', qte: '1', unite: '', pu: ''},
      km: {desc: 'Déplacement', qte: '', unite: 'km', pu: r.km},
      heure: {desc: "Main-d'œuvre", qte: '', unite: 'h', pu: r.heure}
    }[b.dataset.add]);
    renderLignes(); modifie();
    $(`[name="l.${b.dataset.add === 'article' ? 'desc' : 'qte'}.${f.lignes.length - 1}"]`).focus();
  } else if (b.dataset.del) {
    f.lignes.splice(+b.dataset.del, 1);
    renderLignes(); modifie();
  } else if (b.dataset.tab) {
    document.body.dataset.tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    scrollTo(0, 0);
  } else if (b.dataset.open) {
    ouvrir(b.dataset.open); $('#dlgHist').close();
  } else if (b.dataset.dup) {
    creer(db.factures.find(x => x.id === b.dataset.dup)); $('#dlgHist').close();
  } else if (b.dataset.suppr) {
    const x = db.factures.find(x => x.id === b.dataset.suppr);
    if (!confirm(`Supprimer définitivement la facture ${x.numero} ?`)) return;
    db.factures.splice(db.factures.indexOf(x), 1);
    if (x === f) db.factures.length ? ouvrir(db.factures.at(-1).id) : creer(); else sauver();
    renderHist();
  }
});

// ---------- Aperçu de la facture ----------
function rendu() {
  const f = cur(), r = db.reglages, t = calc(f), c = f.client;
  const franchise = f.tva === 'franchise';
  const lignes = f.lignes.map((l, i) => [l, t.lignes[i]]).filter(([l]) => l.desc || num(l.pu));
  $('#facture').innerHTML = `
    <div class="top">
      <div class="em">
        <b>${esc(r.nom) || 'Votre nom (⚙︎ Réglages)'}</b>
        <div class="pre">${esc(r.adresse)}</div>
        ${r.tel ? `Tél. ${esc(r.tel)}<br>` : ''}${r.email ? `${esc(r.email)}<br>` : ''}
        ${r.entreprise ? `N° d'entreprise : ${esc(r.entreprise)}` : ''}
      </div>
      <div class="meta">
        <h3>FACTURE</h3>
        <div>N° <b>${esc(f.numero)}</b></div>
        <div>Date : ${dt(f.date)}</div>
        ${f.echeance ? `<div>Échéance : ${dt(f.echeance)}</div>` : ''}
      </div>
    </div>
    <div class="cl">
      <small>Facturé à</small>
      <b>${esc(c.nom)}</b>
      <div class="pre">${esc(c.adresse)}</div>
      ${c.email ? `${esc(c.email)}<br>` : ''}${c.tva ? `TVA : ${esc(c.tva)}` : ''}
    </div>
    <table>
      <thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">Prix unit.</th><th class="n">Total${franchise ? '' : ' HTVA'}</th></tr></thead>
      <tbody>${lignes.map(([l, tot]) => `
        <tr><td>${esc(l.desc)}</td><td class="n">${num(l.qte).toLocaleString('fr-BE')} ${esc(l.unite)}</td>
        <td class="n">${eur.format(num(l.pu))}</td><td class="n">${fmt(tot)}</td></tr>`).join('')
        || '<tr><td colspan="4" class="vide">Aucune ligne</td></tr>'}</tbody>
    </table>
    <div class="tot">
      ${franchise ? '' : `<div><span>Total HTVA</span><span>${fmt(t.ht)}</span></div>
      <div><span>${f.tva === 'auto' ? 'TVA (autoliquidation)' : `TVA ${t.taux} %`}</span><span>${fmt(t.tva)}</span></div>`}
      <div class="big"><span>${franchise || f.tva === 'auto' ? 'Total à payer' : 'Total TVAC'}</span><span>${fmt(t.ttc)}</span></div>
    </div>
    ${MENTIONS[f.tva] ? `<p class="mention">${MENTIONS[f.tva]}</p>` : ''}
    ${r.iban ? `<div class="pay"><b>Paiement</b><br>À verser sur le compte ${esc(r.iban)}${r.bic ? ` (BIC ${esc(r.bic)})` : ''}${f.echeance ? ` avant le ${dt(f.echeance)}` : ''}<br>Communication : facture ${esc(f.numero)}</div>` : ''}
    ${f.notes ? `<div class="notes pre">${esc(f.notes)}</div>` : ''}
    <div class="foot">${[r.nom, r.entreprise && "N° d'entreprise " + r.entreprise, r.iban].filter(Boolean).map(esc).join(' · ')}</div>`;
  $('#sous').textContent = franchise ? 'Total' : `HTVA ${fmt(t.ht)} · TVA ${fmt(t.tva)}`;
  $('#total').textContent = fmt(t.ttc);
}

// ---------- Impression / PDF ----------
$('#bPrint').onclick = () => print();

let pdfPret = null; // PDF déjà créé, en attente d'un 2e toucher (iOS bloque le partage si la création a pris trop de temps)
function majPdf() { $('#bPdf').textContent = pdfPret ? '📤 Envoyer' : tactile ? '📤 PDF' : '⬇ PDF'; }

function telecharger(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
}

async function partager(file) {
  if (!tactile || !navigator.canShare?.({files: [file]})) return telecharger(file);
  try { await navigator.share({files: [file]}); }
  catch (e) {
    if (e.name === 'NotAllowedError') { pdfPret = file; majPdf(); }
    else if (e.name !== 'AbortError') throw e;
  }
}

$('#bPdf').onclick = async () => {
  const b = $('#bPdf');
  try {
    if (pdfPret) { const file = pdfPret; pdfPret = null; return await partager(file); }
    if (!window.html2pdf) return alert('Création du PDF impossible (pas de connexion internet ?).\nUtilise « Imprimer » puis « Enregistrer en PDF ».');
    b.disabled = true; b.textContent = '⏳ PDF…';
    const f = cur();
    const blob = await html2pdf().set({
      margin: 0,
      image: {type: 'jpeg', quality: 0.95},
      html2canvas: {scale: 2},
      jsPDF: {unit: 'mm', format: 'a4'},
      pagebreak: {avoid: 'tr'}
    }).from($('#facture')).outputPdf('blob');
    const nom = `Facture ${f.numero}${f.client.nom ? ' - ' + f.client.nom : ''}.pdf`.replace(/[\\/:*?"<>|]/g, '-');
    await partager(new File([blob], nom, {type: 'application/pdf'}));
  } catch (e) {
    alert('Erreur PDF : ' + e.message);
  } finally {
    b.disabled = false; majPdf();
  }
};

// ---------- Ticket fournisseur : photo → lignes ----------
// ponytail: lecture ligne par ligne (prix = nombre à 2 décimales), pensée pour les tickets simples ;
// les tickets en colonnes exotiques passent par l'écran de contrôle, où tout se corrige.
const PRIX = /-?\d{1,6},\d{2}(?![\d%])/g;
const IGNORER = /total|totaal|sous-t|subtot|tva|btw|montant|payer|payé|cash|esp[eè]ces|carte|bancontact|maestro|visa|mastercard|rendu|merci|bedankt|kassa|caisse|t[eé]l[ .:]|www|iban|bic|date|heure/i;

function lireTicket(texte) {
  const items = [];
  let avant = ''; // ligne de texte sans prix : désignation possible de la ligne suivante
  for (const brut of texte.split('\n')) {
    if (!brut.trim()) continue;
    if (IGNORER.test(brut) || /\b\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\b/.test(brut)) { avant = ''; continue; } // + dates
    const ligne = brut.replace(/(\d)\s*[.,]\s*(\d{2})(?!\d)/g, '$1,$2').replace(/\s+/g, ' ').trim();
    const prix = ligne.match(PRIX) || [];
    if (!prix.length) { avant = /[a-zà-ü]{3}/i.test(ligne) ? ligne : ''; continue; }
    const mx = ligne.match(/(\d+(?:,\d+)?)\s*[x×*]\s*(-?\d{1,6},\d{2})/i);
    let qte = 1, pu;
    if (mx) { qte = num(mx[1]); pu = num(mx[2]); }
    else if (prix.length >= 2) {
      const total = num(prix.at(-1)), q = num(prix.at(-2)) ? total / num(prix.at(-2)) : 0;
      if (q >= 1 && Math.abs(q - Math.round(q * 100) / 100) < 0.005) { qte = Math.round(q * 100) / 100; pu = num(prix.at(-2)); }
      else pu = total;
    } else pu = num(prix[0]);
    let desc = ligne.slice(0, mx ? mx.index : ligne.search(PRIX)).trim();
    const fin = desc.match(/\s*\b(\d+(?:,\d+)?)\s*(pc|pce|pcs|st|stk|u|m)?\.?$/i);
    if (fin && num(fin[1]) === qte) desc = desc.slice(0, fin.index).trim();
    if (!/[a-zà-ü]{3}/i.test(desc) && avant) desc = avant;
    avant = '';
    if (pu && /[a-zà-ü]{2}/i.test(desc)) items.push({desc, qte, pu, ok: pu > 0}); // sans libellé : date, n° de ticket…
  }
  return items;
}
// Auto-contrôle de la lecture (message dans la console si elle est fausse)
(() => { const t = lireTicket('Rue de Gand 123\n25.09.2026 14:12\nPRISE DOUBLE NIKO 2 x 12,50 25,00\nCABLE XVB 3G2,5\n\n25 1.85 46,25\nTOTAL 71,25\nBANCONTACT 71,25');
  console.assert(t.length === 2 && t[0].desc === 'PRISE DOUBLE NIKO' && t[0].qte === 2 && t[0].pu === 12.5
    && t[1].desc === 'CABLE XVB 3G2,5' && t[1].qte === 25 && t[1].pu === 1.85, 'Lecture de ticket fausse', t); })();

let ticket = {items: [], texte: ''};
const nb = n => String(n).replace('.', ',');
const venteCts = it => Math.round(num(it.pu) / (db.reglages.ticketTvac ? 1.21 : 1) * (1 + num(db.reglages.marge) / 100) * 100);
const etatTicket = t => $('#ticket').innerHTML = `<p>${t}</p>`;

function chargerScript(src) {
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => ko(Error('pas de connexion internet ?'));
    document.head.append(s);
  });
}

async function lireImage(file) {
  $('#dlgTicket').showModal();
  etatTicket('Préparation de la photo…');
  try {
    if (!window.Tesseract) await chargerScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const img = await createImageBitmap(file);
    const k = Math.min(1, 2000 / Math.max(img.width, img.height)); // assez net pour lire, pas trop lourd pour un téléphone
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const w = await Tesseract.createWorker('fra', 1, {logger: m => {
      if (m.progress == null) return;
      etatTicket(`${m.status === 'recognizing text' ? 'Lecture du ticket' : 'Chargement du moteur de lecture (plus long la 1re fois)'}… ${Math.round(m.progress * 100)} %`);
    }});
    try {
      // mode 6 = « bloc uniforme » : garde chaque prix sur la ligne de son article (le mode 4 sautait la colonne de droite)
      await w.setParameters({tessedit_pageseg_mode: '6', preserve_interword_spaces: '1'});
      ticket.texte = (await w.recognize(c)).data.text;
    } finally { await w.terminate(); }
    ticket.items = lireTicket(ticket.texte);
    renderTicket();
  } catch (e) {
    etatTicket('Lecture impossible : ' + esc(e.message));
  }
}

function renderTicket() {
  const r = db.reglages, it = ticket.items;
  $('#ticket').innerHTML = `
    <div class="grid">
      <label>Marge matériel (%)<input id="tMarge" inputmode="decimal" value="${esc(r.marge)}"></label>
      <label class="chk"><input type="checkbox" id="tTvac" ${r.ticketTvac ? 'checked' : ''}> Prix du ticket TVAC (21 %)</label>
    </div>
    <p class="note">${it.length ? `${it.length} ligne(s) trouvée(s). Vérifie et corrige avant d'ajouter.` : 'Aucune ligne avec un prix trouvée. Reprends la photo bien à plat, avec plus de lumière.'}</p>
    ${it.map((x, i) => `
      <div class="tl ${x.ok ? '' : 'off'}">
        <input type="checkbox" data-ti="${i}" data-tk="ok" ${x.ok ? 'checked' : ''} aria-label="Garder la ligne">
        <input data-ti="${i}" data-tk="desc" value="${esc(x.desc)}" aria-label="Désignation">
        <div class="n3">
          <label>Qté<input data-ti="${i}" data-tk="qte" inputmode="decimal" value="${esc(nb(x.qte))}"></label>
          <label>Achat €<input data-ti="${i}" data-tk="pu" inputmode="decimal" value="${esc(typeof x.pu === 'number' ? nb(x.pu.toFixed(2)) : x.pu)}"></label>
          <output id="tv${i}" title="Prix de vente HTVA">→ ${fmt(venteCts(x))}</output>
        </div>
      </div>`).join('')}
    <details><summary>Texte lu sur la photo</summary><pre>${esc(ticket.texte)}</pre></details>
    <p><button class="primary" id="tAjout" ${it.some(x => x.ok) ? '' : 'disabled'}>Ajouter à la facture</button></p>`;
}

['input', 'change'].forEach(t => $('#ticket').addEventListener(t, e => {
  const el = e.target;
  if (el.id === 'tMarge') db.reglages.marge = el.value;
  else if (el.id === 'tTvac') db.reglages.ticketTvac = el.checked;
  else if (el.dataset.tk) {
    const x = ticket.items[el.dataset.ti];
    x[el.dataset.tk] = el.type === 'checkbox' ? el.checked : el.value;
    el.closest('.tl').classList.toggle('off', !x.ok);
    $('#tAjout').disabled = !ticket.items.some(x => x.ok);
  } else return;
  sauver();
  ticket.items.forEach((x, i) => $('#tv' + i).textContent = '→ ' + fmt(venteCts(x)));
}));

$('#ticket').addEventListener('click', e => {
  if (e.target.id !== 'tAjout') return;
  const f = cur();
  f.lignes = f.lignes.filter(l => l.desc || num(l.pu)); // retire la ligne vide de départ
  for (const x of ticket.items.filter(x => x.ok))
    f.lignes.push({desc: x.desc, qte: nb(x.qte), unite: '', pu: (venteCts(x) / 100).toFixed(2).replace('.', ',')});
  $('#dlgTicket').close();
  renderLignes(); modifie();
});

$('#bTicket').onclick = () => $('#fTicket').click();
$('#fTicket').onchange = e => { const file = e.target.files[0]; e.target.value = ''; if (file) lireImage(file); };

// ---------- Sauvegarde (export / import) ----------
$('#bExport').onclick = () =>
  telecharger(new File([JSON.stringify(db, null, 1)], `factures-sauvegarde-${today()}.json`, {type: 'application/json'}));

$('#fImport').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.factures)) throw Error('ce fichier n\'est pas une sauvegarde de factures');
    if (!confirm(`Remplacer toutes les données de cet appareil par cette sauvegarde (${d.factures.length} factures) ?`)) return;
    db = d; demarrer(); $('#dlgReglages').close();
  } catch (err) { alert('Import impossible : ' + err.message); }
};

// ---------- Démarrage ----------
function demarrer() {
  db.reglages = {...DEFAUT, ...db.reglages};
  if (cur()) ouvrir(db.courante);
  else if (db.factures.length) ouvrir(db.factures.at(-1).id);
  else creer();
  majPdf();
}
demarrer();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
